name: Inspect VisitBeaches data wiring
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-visitbeaches.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Inspect VisitBeaches GraphQL schema and report structure
        shell: bash
        run: |
          python - <<'PY'
          import json,re,requests
          s=requests.Session()
          s.headers.update({'User-Agent':'KnowTheGulf/1.0 (+https://knowthegulf.com)'})
          js=s.get('https://visitbeaches.org/static/js/main.5c06dc4b.js',timeout=30).text
          for needle in ('lastThreeDaysOfReports','BeachReport on Report','ParameterValue on ParameterValue','fragment Beach on Beach','query Beaches','Beach Ambassador Reports'):
              print('\n=== CONTEXT',needle,'===')
              pos=js.find(needle)
              print('pos',pos)
              if pos>=0: print(js[max(0,pos-2200):pos+5000])
          endpoint='https://api.visitbeaches.org/graphql'
          def gql(query, variables=None):
              r=s.post(endpoint,json={'query':query,'variables':variables or {}},timeout=30)
              print('GRAPHQL_STATUS',r.status_code,r.headers.get('content-type'))
              try:
                  data=r.json()
              except Exception:
                  print(r.text[:4000]); return None
              print(json.dumps(data,indent=2)[:30000])
              return data
          for typename in ('Beach','Report','BeachReport','ReportParameter','Parameter','ParameterValue','User'):
              print('\n=== TYPE',typename,'===')
              gql('query($name:String!){__type(name:$name){name kind fields{name type{kind name ofType{kind name ofType{kind name}}} args{name type{kind name ofType{kind name}}}}}}}',{'name':typename})
          print('\n=== QUERY ROOT ===')
          gql('{__schema{queryType{fields{name type{kind name ofType{kind name}} args{name type{kind name ofType{kind name}}}}}}}')
          PY
