name: Backfill NWS Surf Zone history

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/backfill-nws-history.yml'
      - 'scripts/backfill_nws_srf.py'
      - 'scripts/audit_nws_flag_recovery.py'
      - 'tests/test_nws_srf_parser.py'
  schedule:
    - cron: '41 4 * * 1'
      timezone: 'America/Chicago'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: safe2swim-data-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recover NWS Surf Zone Forecast archive
        run: python scripts/backfill_nws_srf.py
      - name: Audit recovered flags against primary PCBFLAGS archive
        run: python scripts/audit_nws_flag_recovery.py
      - name: Run parser and project tests
        run: pytest -q
      - name: Commit supplemental historical data
        id: commit_data
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name "safe2swim-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/nws_srf_observations.csv data/nws_srf_daily.csv data/nws_flag_recovery.csv data/nws_srf_summary.json data/nws_flag_overlap_audit.csv data/nws_flag_overlap_audit.json
            git commit -m "data: refresh NWS surf-zone history and audit"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure GitHub Pages
        if: steps.commit_data.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload refreshed site
        if: steps.commit_data.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy refreshed site
        if: steps.commit_data.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
