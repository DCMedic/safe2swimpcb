name: Backfill NWS Surf Zone history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-nws-history.yml'
      - 'scripts/backfill_nws_srf.py'
      - 'scripts/audit_nws_flag_recovery.py'
      - 'scripts/promote_nws_recovered_flags.py'
      - 'scripts/build_daily_flags.py'
      - 'tests/test_nws_srf_parser.py'
  schedule:
    - cron: '41 4 * * 1'
      timezone: 'America/Chicago'

permissions:
  contents: write

concurrency:
  group: knowthegulf-core-data-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Recover NWS Surf Zone Forecast archive
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            NWS_SRF_FULL_BACKFILL=1 python scripts/backfill_nws_srf.py
          else
            python scripts/backfill_nws_srf.py
          fi

      - name: Audit recovered flags against primary PCBFLAGS archive
        run: python scripts/audit_nws_flag_recovery.py

      - name: Promote only non-overlapping NWS Bay flag reports
        run: python scripts/promote_nws_recovered_flags.py

      - name: Rebuild extended flag history
        run: python scripts/build_daily_flags.py

      - name: Validate recovered history
        run: |
          python scripts/validate_data.py
          pytest -q

      - name: Enrich newly recovered dates for research
        id: enrich
        continue-on-error: true
        run: |
          python scripts/update_environment.py
          python scripts/build_model_dataset.py
          python scripts/validate_data.py

      - name: Revert incomplete enrichment if an external API was unavailable
        if: steps.enrich.outcome == 'failure'
        run: |
          git restore data/environmental_daily.csv data/model_training.csv data/model_metrics.json || true
          echo "Historical flags were recovered successfully; environmental enrichment will retry during the normal daily refresh."

      - name: Commit only NWS-history owned paths
        run: |
          owned_paths=(
            data/nws_srf_observations.csv
            data/nws_srf_daily.csv
            data/nws_flag_recovery.csv
            data/nws_srf_summary.json
            data/nws_flag_overlap_audit.csv
            data/nws_flag_overlap_audit.json
            data/flag_observations_recovered.csv
            data/flag_recovery_summary.json
            data/flag_observations_master.csv
            data/flag_observations_master.json
            data/flag_daily_master.csv
            data/flag_daily_master.json
            data/flag_summary.json
            data/environmental_daily.csv
            data/model_training.csv
            data/model_metrics.json
          )
          if [[ -z "$(git status --porcelain -- "${owned_paths[@]}")" ]]; then
            echo "No extended historical-data changes to commit."; exit 0
          fi
          bash scripts/persist_paths.sh "data: extend PCB flag history with audited NWS recovery" "${owned_paths[@]}"

      # Pages deployment is intentionally centralized in deploy-pages.yml.
