name: Refresh measured NOAA and storm history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/recovery/history_enrichment.trigger'
  schedule:
    - cron: '17 4 * * 6'
      timezone: 'America/Chicago'

permissions:
  contents: write

concurrency:
  group: knowthegulf-history-enrichment-write
  cancel-in-progress: false

jobs:
  enrich-history:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh measured NOAA NDBC observations
        run: python scripts/update_ndbc_measured.py

      - name: Refresh NOAA NHC tropical cyclone history
        run: python scripts/update_tropical_cyclones.py

      - name: Audit historical West End PCB flag-status mirror
        run: python scripts/backfill_westendpcb_flags.py

      - name: Hunt archived official pages for pre-2017 flag candidates
        if: github.event_name != 'push'
        id: pre2017
        continue-on-error: true
        run: python scripts/hunt_pre2017_flags.py

      - name: Preserve hunt status if archive service was unavailable
        if: github.event_name != 'push' && steps.pre2017.outcome == 'failure'
        run: echo "Pre-2017 Wayback discovery was unavailable this run; measured NOAA, HURDAT2, and community-mirror auditing will continue."

      - name: Rebuild research table with measured and storm context
        run: python scripts/build_model_dataset.py

      - name: Validate data and parsers
        run: |
          python scripts/validate_data.py
          pytest -q
          node --check assets/app.js

      - name: Record history-enrichment success heartbeat
        run: python scripts/write_workflow_health.py --workflow "Refresh measured NOAA and storm history" --output data/workflow_health/history_enrichment.json

      - name: Commit only historical-enrichment owned paths
        run: |
          rm -f data/ndbc_measured_observations.csv
          owned_paths=(
            data/ndbc_measured_daily.csv
            data/ndbc_measured_summary.json
            data/tropical_cyclone_track_points_near_pcb.csv
            data/tropical_cyclone_events_near_pcb.csv
            data/tropical_cyclone_daily.csv
            data/tropical_cyclone_summary.json
            data/westendpcb_flag_posts.csv
            data/pre2017_westendpcb_candidates.csv
            data/westendpcb_flag_overlap_audit.csv
            data/westendpcb_flag_summary.json
            data/pre2017_flag_candidates.csv
            data/pre2017_flag_hunt_summary.json
            data/model_training.csv
            data/model_metrics.json
            data/workflow_health/history_enrichment.json
          )
          if [[ -z "$(git status --porcelain -- "${owned_paths[@]}")" ]]; then
            echo "No historical-enrichment changes to commit."; exit 0
          fi
          bash scripts/persist_paths.sh "data: refresh measured NOAA, cyclone, and historical flag research" "${owned_paths[@]}"

      # Pages deployment is intentionally centralized in deploy-pages.yml.
