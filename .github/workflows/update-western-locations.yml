name: Update western Gulf data
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-western-locations.yml'
      - 'scripts/update_western_locations.py'
      - 'scripts/update_destin_current.py'
      - 'scripts/florida_flag_terms.py'
      - 'scripts/apply_florida_flag_terms.py'
      - 'tests/test_florida_flag_terms.py'
  schedule:
    - cron: '17 7 * * *'
      timezone: 'America/Chicago'
permissions:
  contents: write
concurrency:
  group: knowthegulf-data-write
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install requests beautifulsoup4 pandas pytest
      - name: Validate Florida flag terminology
        run: pytest -q tests/test_florida_flag_terms.py
      - run: python scripts/update_western_locations.py
      - name: Re-verify current Destin flag after historical refresh
        run: python scripts/update_destin_current.py
      - name: Apply canonical Florida warning-flag terminology
        run: python scripts/apply_florida_flag_terms.py destin okaloosa-island navarre-beach pensacola-beach
      - name: Commit refreshed western Gulf data
        run: |
          if [[ -z "$(git status --porcelain data/destin data/okaloosa-island data/navarre-beach data/pensacola-beach data/western)" ]]; then
            echo "No western Gulf data changes to commit."; exit 0
          fi
          git config user.name "knowthegulf-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/destin data/okaloosa-island data/navarre-beach data/pensacola-beach data/western
          git commit -m "data: refresh western Gulf beaches"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            if [[ "$attempt" -eq 3 ]]; then echo "Failed to persist western Gulf data after 3 attempts." >&2; exit 1; fi
            sleep $((attempt * 5))
          done

      # Pages deployment is intentionally centralized in deploy-pages.yml.
