name: Update western Gulf data
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-western-locations.yml'
      - 'scripts/update_western_locations.py'
  schedule:
    - cron: '17 7 * * *'
      timezone: 'America/Chicago'
permissions:
  contents: write
concurrency:
  group: knowthegulf-data-write
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install requests beautifulsoup4 pandas
      - run: python scripts/update_western_locations.py
      - name: Commit refreshed western Gulf data
        run: |
          if [[ -n "$(git status --porcelain data/destin data/okaloosa-island data/navarre-beach data/pensacola-beach data/western)" ]]; then
            git config user.name "knowthegulf-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/destin data/okaloosa-island data/navarre-beach data/pensacola-beach data/western
            git commit -m "data: refresh western Gulf beaches"
            git pull --rebase
            git push
          else
            echo "No western Gulf data changes to commit."
          fi

      # Pages deployment is intentionally centralized in deploy-pages.yml.
