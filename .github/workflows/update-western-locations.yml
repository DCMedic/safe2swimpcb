name: Update Destin and Okaloosa data
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-western-locations.yml'
      - 'scripts/update_western_locations.py'
  schedule:
    - cron: '17 7 * * *'
      timezone: 'America/Chicago'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: knowthegulf-data-write
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install requests beautifulsoup4 pandas
      - run: python scripts/update_western_locations.py
      - name: Commit refreshed western Gulf data
        id: commit_data
        run: |
          if [[ -n "$(git status --porcelain data/destin data/okaloosa-island data/western)" ]]; then
            git config user.name "knowthegulf-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/destin data/okaloosa-island data/western
            git commit -m "data: refresh Destin and Okaloosa Island"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure GitHub Pages
        if: steps.commit_data.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload refreshed site
        if: steps.commit_data.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy refreshed site
        if: steps.commit_data.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
