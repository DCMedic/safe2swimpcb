name: Update western Gulf data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-western-locations.yml'
      - '.github/recovery/western.trigger'
      - 'scripts/update_western_locations.py'
      - 'scripts/refresh_western_current_flags.py'
      - 'scripts/flag_image_verification.py'
      - 'scripts/collector_resilience.py'
      - 'scripts/protect_current_flag.py'
      - 'scripts/florida_flag_terms.py'
      - 'scripts/apply_florida_flag_terms.py'
      - 'requirements.txt'
      - 'tests/test_collector_resilience.py'
      - 'tests/test_western_current.py'
      - 'tests/test_western_current_evidence.py'
      - 'tests/test_flag_image_verification.py'
  schedule:
    - cron: '17 7,9,11,13,15,17,19,21 * * *'
      timezone: 'America/Chicago'
permissions:
  contents: write
concurrency:
  group: knowthegulf-western-data-write
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate western collector entry points
        run: python -m py_compile scripts/update_western_locations.py scripts/refresh_western_current_flags.py scripts/flag_image_verification.py scripts/collector_resilience.py scripts/protect_current_flag.py scripts/florida_flag_terms.py scripts/apply_florida_flag_terms.py
      - name: Run western collector regression tests
        run: pytest -q tests/test_collector_resilience.py tests/test_western_current.py tests/test_western_current_evidence.py tests/test_flag_image_verification.py
      - name: Snapshot last-known western official flags
        shell: bash
        run: |
          mkdir -p tmp/western-before
          for slug in okaloosa-island navarre-beach pensacola-beach; do
            if [[ -f "data/${slug}/current_flag.json" ]]; then
              cp "data/${slug}/current_flag.json" "tmp/western-before/${slug}.json"
            fi
          done
      - name: Refresh western Gulf data
        run: python scripts/update_western_locations.py
      - name: Prevent transient western flag regressions
        shell: bash
        run: |
          for slug in okaloosa-island navarre-beach pensacola-beach; do
            previous="tmp/western-before/${slug}.json"
            current="data/${slug}/current_flag.json"
            if [[ -f "$previous" && -f "$current" ]]; then
              python scripts/protect_current_flag.py \
                --previous "$previous" \
                --current "$current" \
                --max-age-hours 3 \
                --mode missing-flag
            fi
          done
      - name: Apply canonical Florida warning-flag terminology
        run: python scripts/apply_florida_flag_terms.py okaloosa-island navarre-beach pensacola-beach
      - name: Require explicit current-status evidence with guarded image/API fallback
        run: python scripts/refresh_western_current_flags.py
      - name: Preserve dedicated Destin current-condition ownership
        run: git restore data/destin/current_flag.json
      - name: Commit refreshed western Gulf data
        run: |
          owned_paths=(data/destin data/okaloosa-island data/navarre-beach data/pensacola-beach data/western)
          if [[ -z "$(git status --porcelain -- "${owned_paths[@]}")" ]]; then echo "No western Gulf data changes to commit."; exit 0; fi
          git add -- "${owned_paths[@]}"
          if [[ -n "$(git status --porcelain --untracked-files=no | grep -v '^.. data/destin/current_flag.json$' | grep '^ [MADRCU?]' || true)" ]]; then git status --short >&2; exit 1; fi
          bash scripts/persist_paths.sh "data: refresh western Gulf beaches" "${owned_paths[@]}"
