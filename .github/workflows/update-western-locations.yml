name: Update western Gulf data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-western-locations.yml'
      - 'scripts/update_western_locations.py'
      - 'scripts/florida_flag_terms.py'
      - 'scripts/apply_florida_flag_terms.py'
  schedule:
    - cron: '17 7 * * *'
      timezone: 'America/Chicago'
permissions:
  contents: write
concurrency:
  group: knowthegulf-western-data-write
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install requests beautifulsoup4 pandas
      - name: Validate western collector entry points
        run: python -m py_compile scripts/update_western_locations.py scripts/florida_flag_terms.py scripts/apply_florida_flag_terms.py
      - run: python scripts/update_western_locations.py
      - name: Apply canonical Florida warning-flag terminology
        run: python scripts/apply_florida_flag_terms.py okaloosa-island navarre-beach pensacola-beach
      - name: Preserve dedicated Destin current-condition ownership
        run: |
          # update_western_locations.py also refreshes Destin's historical/environmental
          # datasets. The dedicated Destin poller alone owns current_flag.json.
          git restore data/destin/current_flag.json
      - name: Commit refreshed western Gulf data
        run: |
          owned_paths=(
            data/destin
            data/okaloosa-island
            data/navarre-beach
            data/pensacola-beach
            data/western
          )

          if [[ -z "$(git status --porcelain -- "${owned_paths[@]}")" ]]; then
            echo "No western Gulf data changes to commit."; exit 0
          fi

          git config user.name "knowthegulf-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- "${owned_paths[@]}"

          # current_flag.json was restored above and therefore cannot enter this
          # commit. Fail closed if any other tracked change escaped the ownership set;
          # otherwise a later git pull --rebase would reject the dirty worktree.
          if [[ -n "$(git status --porcelain --untracked-files=no | grep -v '^.. data/destin/current_flag.json$' | grep '^ [MADRCU?]' || true)" ]]; then
            echo "Western collector left unstaged tracked changes outside its ownership set:" >&2
            git status --short >&2
            exit 1
          fi

          git commit -m "data: refresh western Gulf beaches"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            if [[ "$attempt" -eq 3 ]]; then echo "Failed to persist western Gulf data after 3 attempts." >&2; exit 1; fi
            sleep $((attempt * 5))
          done

      # Destin current_flag.json is intentionally owned only by poll-destin-flag.yml.
      # Pages deployment is intentionally centralized in deploy-pages.yml.
