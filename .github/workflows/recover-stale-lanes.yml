name: Recover stale data lanes

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only preview or production recovery'
        type: choice
        options: [dry-run, apply]
        default: dry-run
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-stale-lanes.yml'
      - '.github/recovery/policy.json'
      - 'scripts/recovery_watchdog.py'
      - 'tests/test_recovery_watchdog.py'
      - 'tests/test_recovery_safety.py'
  workflow_run:
    workflows:
      - Poll current PCB beach flag
      - Poll current Destin beach flag
      - Update western Gulf data
      - Update eastern Panhandle flags
      - Update Southwest Florida locations
      - Publish Know the Gulf to X
      - Refresh Know the Gulf research dataset
      - Refresh measured NOAA and storm history
      - Backfill NWS Surf Zone history
    types: [completed]
    branches: [main]
  schedule:
    - cron: '5,15,25,35,45,55 * * * *'

permissions:
  contents: read

jobs:
  preview:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'apply') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: knowthegulf-recovery-preview-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - run: pytest -q tests/test_recovery_watchdog.py tests/test_recovery_safety.py
      - name: Read-only recovery preview
        run: python scripts/recovery_watchdog.py --dry-run --repo "${GITHUB_REPOSITORY}"
  recover:
    if: "${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_run' && (github.event.workflow_run.name != 'Publish Know the Gulf to X' || github.event.workflow_run.display_title == 'Know the Gulf X: publish')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply')) }}"
    permissions:
      contents: read
      actions: write
    # Preview runs must not replace pending production recovery checks.
    concurrency:
      group: knowthegulf-recovery-controller
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate recovery controller syntax
        run: python -m py_compile scripts/recovery_watchdog.py
      - name: Install recovery test dependency
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run recovery regression tests
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: pytest -q tests/test_recovery_watchdog.py tests/test_recovery_safety.py
      - name: Dispatch overdue lanes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/recovery_watchdog.py --apply --repo "${GITHUB_REPOSITORY}"
