name: Recover stale data lanes

on:
  workflow_dispatch:
  schedule:
    - cron: '11,31,51 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: knowthegulf-recovery-controller
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install recovery test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate recovery controller
        run: |
          python -m py_compile scripts/recovery_watchdog.py
          pytest -q tests/test_recovery_watchdog.py
      - name: Dispatch overdue lanes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/recovery_watchdog.py --repo "${GITHUB_REPOSITORY}"
