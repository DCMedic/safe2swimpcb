name: Recover stale data lanes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-stale-lanes.yml'
      - '.github/recovery/policy.json'
      - 'scripts/recovery_watchdog.py'
      - 'tests/test_recovery_watchdog.py'
  workflow_run:
    workflows:
      - Poll current PCB beach flag
      - Poll current Destin beach flag
      - Update western Gulf data
      - Update eastern Panhandle flags
      - Update Southwest Florida locations
      - Publish Know the Gulf to X
      - Refresh Know the Gulf research dataset
      - Refresh measured NOAA and storm history
      - Backfill NWS Surf Zone history
    types: [completed]
    branches: [main]
  schedule:
    - cron: '5,15,25,35,45,55 * * * *'

permissions:
  contents: read
  actions: write

# Recovery checks are short and idempotent. Never cancel an older check merely
# because another production workflow completed; cancellation could otherwise
# starve recovery during a burst of overlapping workflow completions.
concurrency:
  group: knowthegulf-recovery-controller
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate recovery controller syntax
        run: python -m py_compile scripts/recovery_watchdog.py
      - name: Install recovery test dependency
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run recovery regression tests
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: pytest -q tests/test_recovery_watchdog.py
      - name: Dispatch overdue lanes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/recovery_watchdog.py --repo "${GITHUB_REPOSITORY}"
