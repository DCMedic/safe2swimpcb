name: Poll current PCB beach flag
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 6-22 * * *'
      timezone: 'America/Chicago'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: safe2swim-data-write
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install requests beautifulsoup4 pandas
      - run: python scripts/update_current_flag.py
      - run: python scripts/build_daily_flags.py
      - run: python scripts/validate_data.py
      - name: Commit status changes or heartbeat
        id: commit_data
        run: |
          if [[ -n "$(git status --porcelain data/current_flag.json data/flag_observations_auto.csv data/flag_daily_master.csv data/flag_daily_master.json data/flag_observations_master.csv data/flag_observations_master.json data/flag_summary.json)" ]]; then
            git config user.name "safe2swim-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/current_flag.json data/flag_observations_auto.csv data/flag_daily_master.csv data/flag_daily_master.json data/flag_observations_master.csv data/flag_observations_master.json data/flag_summary.json
            git commit -m "data: refresh PCB beach flag"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure GitHub Pages
        if: steps.commit_data.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload refreshed site
        if: steps.commit_data.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy refreshed site
        if: steps.commit_data.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
