name: Poll current PCB beach flag
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/poll-current-flag.yml'
      - 'scripts/update_current_flag.py'
  schedule:
    - cron: '7,37 6-22 * * *'
      timezone: 'America/Chicago'
permissions:
  contents: write
concurrency:
  group: knowthegulf-data-write
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install requests beautifulsoup4 pandas
      - run: python scripts/update_current_flag.py
      - run: python scripts/build_daily_flags.py
      - run: python scripts/validate_data.py
      - name: Commit status changes or verification heartbeat
        id: commit_data
        run: |
          if [[ -n "$(git status --porcelain data/current_flag.json data/flag_observations_auto.csv data/flag_daily_master.csv data/flag_daily_master.json data/flag_observations_master.csv data/flag_observations_master.json data/flag_summary.json)" ]]; then
            git config user.name "knowthegulf-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/current_flag.json data/flag_observations_auto.csv data/flag_daily_master.csv data/flag_daily_master.json data/flag_observations_master.csv data/flag_observations_master.json data/flag_summary.json
            git commit -m "data: refresh PCB beach flag"
            git pull --rebase

            # GitHub occasionally returns a transient 5xx error while accepting a push.
            # Retry a few times with bounded backoff, rebasing before each retry so
            # genuine branch movement is handled without masking persistent failures.
            push_succeeded=false
            for attempt in 1 2 3; do
              if git push; then
                push_succeeded=true
                break
              fi

              if [[ "$attempt" -eq 3 ]]; then
                echo "git push failed after 3 attempts" >&2
                exit 1
              fi

              delay=$((attempt * 5))
              echo "git push attempt $attempt failed; retrying in ${delay}s..." >&2
              sleep "$delay"
              git pull --rebase
            done

            if [[ "$push_succeeded" != "true" ]]; then
              echo "git push did not complete successfully" >&2
              exit 1
            fi

            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
