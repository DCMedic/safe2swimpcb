name: Poll current PCB beach flag
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poll-current-flag.yml'
      - 'scripts/update_current_flag.py'
      - 'scripts/florida_flag_terms.py'
      - 'scripts/apply_florida_flag_terms.py'
  schedule:
    - cron: '7,37 6-22 * * *'
      timezone: 'America/Chicago'
permissions:
  contents: write
concurrency:
  group: knowthegulf-core-data-write
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install requests beautifulsoup4 pandas
      - run: python scripts/update_current_flag.py
      - name: Apply canonical Florida warning-flag terminology
        run: python scripts/apply_florida_flag_terms.py pcb
      - run: python scripts/build_daily_flags.py
      - run: python scripts/validate_data.py
      - name: Commit status changes or verification heartbeat
        id: commit_data
        run: |
          if [[ -n "$(git status --porcelain data/current_flag.json data/flag_observations_auto.csv data/flag_daily_master.csv data/flag_daily_master.json data/flag_observations_master.csv data/flag_observations_master.json data/flag_summary.json)" ]]; then
            git config user.name "knowthegulf-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/current_flag.json data/flag_observations_auto.csv data/flag_daily_master.csv data/flag_daily_master.json data/flag_observations_master.csv data/flag_observations_master.json data/flag_summary.json
            git commit -m "data: refresh PCB beach flag"

            for attempt in 1 2 3; do
              if git pull --rebase && git push; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              if [[ "$attempt" -eq 3 ]]; then
                echo "Failed to persist PCB flag after 3 attempts." >&2
                exit 1
              fi
              sleep $((attempt * 5))
            done
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
