name: Update VisitBeaches shadow data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-visitbeaches-shadow.yml'
      - 'scripts/visitbeaches_graphql.py'
      - 'scripts/update_visitbeaches_shadow.py'
      - 'tests/test_visitbeaches_graphql.py'
      - 'requirements.txt'
  schedule:
    - cron: '37 7,9,11,13,15,17,19,21 * * *'
      timezone: 'America/Chicago'

permissions:
  contents: write

concurrency:
  group: knowthegulf-visitbeaches-shadow
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate VisitBeaches adapter
        run: python -m py_compile scripts/visitbeaches_graphql.py scripts/update_visitbeaches_shadow.py
      - name: Run VisitBeaches regression tests
        run: pytest -q tests/test_visitbeaches_graphql.py
      - name: Refresh VisitBeaches Ambassador shadow observations
        run: python scripts/update_visitbeaches_shadow.py
      - name: Validate generated shadow JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/visitbeaches')
          summary=json.loads((root/'summary.json').read_text())
          assert summary['mode']=='shadow_only'
          assert summary['publication_effect']=='none'
          for p in root.glob('*.json'):
              json.loads(p.read_text())
          print('VisitBeaches shadow JSON valid:', len(list(root.glob('*.json'))), 'files')
          PY
      - name: Commit VisitBeaches shadow data
        run: |
          if [[ -z "$(git status --porcelain data/visitbeaches)" ]]; then
            echo "No VisitBeaches shadow changes to commit."; exit 0
          fi
          bash scripts/persist_paths.sh "data: refresh VisitBeaches Ambassador shadow" data/visitbeaches
