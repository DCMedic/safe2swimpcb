name: Poll current Destin beach flag

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poll-destin-flag.yml'
      - '.github/recovery/destin.trigger'
      - 'scripts/update_destin_current.py'
      - 'scripts/collector_resilience.py'
      - 'scripts/common.py'
      - 'scripts/florida_flag_terms.py'
      - 'scripts/apply_florida_flag_terms.py'
      - 'tests/test_destin_flag_parser.py'
      - 'tests/test_collector_resilience.py'
  schedule:
    - cron: '27 * * * *'

permissions:
  contents: write

concurrency:
  group: knowthegulf-western-data-write
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pytest
      - name: Validate Destin collector and terminology layer
        run: python -m py_compile scripts/update_destin_current.py scripts/collector_resilience.py scripts/florida_flag_terms.py scripts/apply_florida_flag_terms.py
      - name: Run Destin collector regression tests
        run: pytest -q tests/test_destin_flag_parser.py tests/test_collector_resilience.py
      - name: Refresh official Destin flag
        run: python scripts/update_destin_current.py
      - name: Apply canonical Florida warning-flag terminology
        run: python scripts/apply_florida_flag_terms.py destin
      - name: Commit Destin flag heartbeat
        shell: bash
        run: |
          git config user.name "knowthegulf-data-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            # Always rebuild the heartbeat from the latest main branch. This avoids
            # replaying a conflicting current_flag.json commit when another writer
            # advances main between checkout and persistence.
            git fetch origin main
            git reset --hard origin/main

            python scripts/update_destin_current.py
            python scripts/apply_florida_flag_terms.py destin

            if [[ -z "$(git status --porcelain -- data/destin/current_flag.json)" ]]; then
              echo "Destin heartbeat already current on main."
              exit 0
            fi

            git add -- data/destin/current_flag.json
            git commit -m "data: refresh Destin beach flag"

            if git push origin HEAD:main; then
              exit 0
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "Failed to persist Destin flag after 3 fresh-base attempts." >&2
              exit 1
            fi

            echo "Main advanced during Destin persistence; rebuilding from latest main (attempt $((attempt + 1))/3)."
            sleep $((attempt * 5))
          done
