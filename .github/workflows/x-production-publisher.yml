name: Publish Know the Gulf to X

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        type: choice
        options: [dry-run, publish]
        default: dry-run
      slot:
        description: 'Optional content slot override'
        required: false
        type: choice
        options: [auto, morning, afternoon, evening]
        default: auto
  push:
    paths:
      - '.github/workflows/x-production-publisher.yml'
      - 'scripts/x_content_engine.py'
      - 'scripts/post_to_x.py'
      - 'scripts/generate_x_condition_card.py'
      - 'scripts/fetch_x_environment.py'
  schedule:
    - cron: '23 8,11,15,18,20 * * *'
      timezone: 'America/Chicago'
    - cron: '23 19 * * 2,5'
      timezone: 'America/Chicago'
permissions:
  contents: write
concurrency:
  group: knowthegulf-x-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Set up Python
        uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install X API and graphics dependencies
        run: python -m pip install --disable-pip-version-check requests requests-oauthlib pillow
      - name: Fetch authoritative environmental data
        run: python scripts/fetch_x_environment.py
      - name: Log environmental validation summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/x_environment.json').read_text())
          pcb=d.get('locations',{}).get('Panama City Beach',{})
          obs=d.get('pcb_observations',{})
          offshore=d.get('regional_offshore',{})
          rip=d.get('rip_current',{})
          air=obs.get('air_temp_observed_f') or pcb.get('air_temp_f')
          wind=obs.get('wind_observed') or {}
          wind_dir=wind.get('direction') or pcb.get('wind_direction') or 'N/A'
          wind_speed=wind.get('speed_mph')
          if wind_speed is None:
              wind_speed=pcb.get('wind_speed','N/A')
          water=obs.get('water_temp_f') or offshore.get('water_temp_f') or 'N/A'
          waves=offshore.get('wave_height_ft','N/A')
          rip_status='NWS explicit risk available' if rip.get('available') else 'Check NWS surf-zone forecast'
          print(f"ENVIRONMENT: Air {air if air is not None else 'N/A'} F | Wind {wind_dir} {wind_speed} | Gulf {water} F | Waves {waves} ft | Rip: {rip_status}")
          PY
      - name: Validate publisher code
        run: |
          python -m py_compile scripts/post_to_x.py scripts/x_content_engine.py scripts/generate_x_condition_card.py scripts/fetch_x_environment.py
          python scripts/generate_x_condition_card.py --output tmp/x-condition-card-validation.png
          python - <<'PY'
          from PIL import Image
          im=Image.open('tmp/x-condition-card-validation.png')
          assert im.size == (1200,675) and im.format == 'PNG'
          print('Validated visual card: 1200x675 PNG')
          PY
      - name: Run production content engine
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_OAUTH2_ACCESS_TOKEN: ${{ secrets.X_OAUTH2_ACCESS_TOKEN }}
          MANUAL_MODE: ${{ inputs.mode }}
          MANUAL_SLOT: ${{ inputs.slot }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [[ "$EVENT_NAME" == "schedule" || "$MANUAL_MODE" == "publish" ]]; then args+=(--publish); fi
          if [[ -n "$MANUAL_SLOT" && "$MANUAL_SLOT" != "auto" ]]; then args+=(--force-slot "$MANUAL_SLOT"); fi
          python scripts/x_content_engine.py "${args[@]}"
      - name: Persist publisher state
        run: |
          if [[ -z "$(git status --porcelain data/x_posting_state.json)" ]]; then echo "No publisher state change to persist."; exit 0; fi
          git config user.name "knowthegulf-x-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/x_posting_state.json
          git commit -m "data: update X publisher state"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            if [[ "$attempt" -eq 3 ]]; then echo "Failed to persist X publisher state after 3 attempts." >&2; exit 1; fi
            sleep $((attempt * 5))
          done
