name: Update eastern Panhandle flags

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-eastern-panhandle.yml'
      - 'scripts/update_eastern_panhandle.py'
      - 'scripts/florida_flag_terms.py'
      - 'scripts/apply_florida_flag_terms.py'
      - 'tests/test_eastern_panhandle_flags.py'
      - 'tests/test_florida_flag_terms.py'
      - 'tests/test_apply_florida_flag_terms.py'
  schedule:
    - cron: '12 * * * *'

permissions:
  contents: write

concurrency:
  group: knowthegulf-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install requests beautifulsoup4 pytest
      - run: python -m py_compile scripts/update_eastern_panhandle.py scripts/florida_flag_terms.py scripts/apply_florida_flag_terms.py
      - run: pytest -q tests/test_eastern_panhandle_flags.py tests/test_florida_flag_terms.py tests/test_apply_florida_flag_terms.py
      - name: Refresh eastern Panhandle flags with bounded retry
        run: |
          for attempt in 1 2 3; do
            if python scripts/update_eastern_panhandle.py; then break; fi
            if [[ "$attempt" -eq 3 ]]; then echo "Eastern collector failed after 3 attempts." >&2; exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Apply canonical Florida warning-flag terminology
        run: python scripts/apply_florida_flag_terms.py south-walton cape-san-blas gulf-state-park-beaches st-joe-beach franklin-county
      - name: Commit refreshed eastern Panhandle flags
        run: |
          if [[ -z "$(git status --porcelain data/south-walton data/cape-san-blas data/gulf-state-park-beaches data/st-joe-beach data/franklin-county)" ]]; then
            echo "No eastern Panhandle data changes to commit."; exit 0
          fi
          git config user.name "knowthegulf-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/south-walton data/cape-san-blas data/gulf-state-park-beaches data/st-joe-beach data/franklin-county
          git commit -m "data: refresh eastern Panhandle flags"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            if [[ "$attempt" -eq 3 ]]; then echo "Failed to persist eastern Panhandle data after 3 attempts." >&2; exit 1; fi
            sleep $((attempt * 5))
          done

      # Pages deployment is intentionally centralized in deploy-pages.yml.
