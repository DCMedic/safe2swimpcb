name: Update eastern Panhandle flags

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-eastern-panhandle.yml'
      - 'scripts/update_eastern_panhandle.py'
      - 'tests/test_eastern_panhandle_flags.py'
  schedule:
    - cron: '12,42 * * * *'

permissions:
  contents: write

concurrency:
  group: knowthegulf-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install requests beautifulsoup4 pytest
      - run: python -m py_compile scripts/update_eastern_panhandle.py
      - run: pytest -q tests/test_eastern_panhandle_flags.py
      - run: python scripts/update_eastern_panhandle.py
      - name: Commit refreshed eastern Panhandle flags
        run: |
          if [[ -n "$(git status --porcelain data/south-walton data/cape-san-blas data/gulf-state-park-beaches data/st-joe-beach data/franklin-county)" ]]; then
            git config user.name "knowthegulf-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/south-walton data/cape-san-blas data/gulf-state-park-beaches data/st-joe-beach data/franklin-county
            git commit -m "data: refresh eastern Panhandle flags"
            git pull --rebase
            git push
          else
            echo "No eastern Panhandle data changes to commit."
          fi

      # Pages deployment is intentionally centralized in deploy-pages.yml.
