name: Validate Know the Gulf site health

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'data/**/*.json'
      - 'sitemap.xml'
      - 'requirements.txt'
      - '.github/workflows/**'
      - '.github/recovery/**'

permissions:
  contents: read

concurrency:
  group: site-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate shared JavaScript
        run: |
          for f in assets/app.js assets/menu.js assets/beach-nav.js assets/site-ui.js assets/western-location.js assets/eastern-location.js assets/southwest-location.js assets/location-page.js; do
            node --check "$f"
          done
      - name: Validate Python, persistence and workflow architecture
        run: |
          python -m compileall -q scripts
          bash -n scripts/persist_paths.sh
          python scripts/validate_workflows.py
      - name: Run repository test suite
        run: pytest -q
      - name: Build standardized deployment HTML
        run: python scripts/inject_social_meta.py
      - name: Validate routes, assets, sitemap and data contracts
        run: python scripts/site_health_check.py
