name: Refresh Safe2Swim research dataset
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
      timezone: 'America/Chicago'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: safe2swim-data-write
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_daily_flags.py
      - run: python scripts/update_environment.py
      - run: python scripts/build_model_dataset.py
      - run: python scripts/validate_data.py
      - run: pytest -q
      - name: Commit finalized/provisional research data
        id: commit_data
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name "safe2swim-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/
            git commit -m "data: daily weather wave tide and model refresh"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure GitHub Pages
        if: steps.commit_data.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload refreshed site
        if: steps.commit_data.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy refreshed site
        if: steps.commit_data.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
