name: Refresh Know the Gulf research dataset
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
      timezone: 'America/Chicago'
permissions:
  contents: write
concurrency:
  group: knowthegulf-core-data-write
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_daily_flags.py
      - run: python scripts/update_environment.py
      - run: python scripts/build_model_dataset.py
      - run: python scripts/validate_data.py
      - run: pytest -q
      - name: Commit finalized/provisional research data
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            bash scripts/persist_paths.sh "data: daily weather wave tide and model refresh" data/
          else
            echo "No research-data changes to commit."
          fi

      # Pages deployment is intentionally centralized in deploy-pages.yml.
