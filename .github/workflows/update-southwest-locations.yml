name: Update Southwest Florida locations

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-southwest-locations.yml'
      - 'scripts/update_southwest_locations.py'
      - 'scripts/florida_flag_terms.py'
      - 'scripts/apply_florida_flag_terms.py'
      - 'tests/test_southwest_sources.py'
      - 'tests/test_florida_flag_terms.py'
  schedule:
    - cron: '22 * * * *'

permissions:
  contents: write

concurrency:
  group: knowthegulf-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate Southwest adapter and Florida terminology
        run: |
          python -m py_compile scripts/update_southwest_locations.py scripts/florida_flag_terms.py scripts/apply_florida_flag_terms.py
          pytest -q tests/test_southwest_sources.py tests/test_florida_flag_terms.py
      - name: Refresh Southwest sources with bounded retry
        run: |
          for attempt in 1 2 3; do
            if python scripts/update_southwest_locations.py; then break; fi
            if [[ "$attempt" -eq 3 ]]; then echo "Southwest collector failed after 3 attempts." >&2; exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Apply canonical Florida warning-flag terminology
        run: python scripts/apply_florida_flag_terms.py anna-maria-island siesta-key venice sanibel fort-myers-beach naples marco-island
      - name: Commit refreshed Southwest data
        run: |
          if [[ -z "$(git status --porcelain data/anna-maria-island data/siesta-key data/venice data/sanibel data/fort-myers-beach data/naples data/marco-island)" ]]; then
            echo "No Southwest data changes to commit."; exit 0
          fi
          git config user.name "knowthegulf-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/anna-maria-island data/siesta-key data/venice data/sanibel data/fort-myers-beach data/naples data/marco-island
          git commit -m "data: refresh Southwest Florida beaches"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            if [[ "$attempt" -eq 3 ]]; then echo "Failed to persist Southwest data after 3 attempts." >&2; exit 1; fi
            sleep $((attempt * 5))
          done

      # Pages deployment is intentionally centralized in deploy-pages.yml.
