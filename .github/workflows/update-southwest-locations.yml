name: Update Southwest Florida locations

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-southwest-locations.yml'
      - 'scripts/update_southwest_locations.py'
      - 'tests/test_southwest_sources.py'
  schedule:
    - cron: '22,52 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: knowthegulf-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate Southwest adapter
        run: |
          python -m py_compile scripts/update_southwest_locations.py
          pytest -q tests/test_southwest_sources.py
      - run: python scripts/update_southwest_locations.py
      - name: Commit refreshed Southwest data
        id: commit_data
        run: |
          if [[ -n "$(git status --porcelain data/anna-maria-island data/siesta-key data/venice data/sanibel data/fort-myers-beach data/naples data/marco-island)" ]]; then
            git config user.name "knowthegulf-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/anna-maria-island data/siesta-key data/venice data/sanibel data/fort-myers-beach data/naples data/marco-island
            git commit -m "data: refresh Southwest Florida beaches"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure GitHub Pages
        if: steps.commit_data.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload refreshed site
        if: steps.commit_data.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy refreshed site
        if: steps.commit_data.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
