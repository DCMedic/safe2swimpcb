name: Update Southwest Florida locations

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-southwest-locations.yml'
      - 'scripts/update_southwest_locations.py'
      - 'tests/test_southwest_sources.py'
  schedule:
    - cron: '22,52 * * * *'

permissions:
  contents: write

concurrency:
  group: knowthegulf-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate Southwest adapter
        run: |
          python -m py_compile scripts/update_southwest_locations.py
          pytest -q tests/test_southwest_sources.py
      - run: python scripts/update_southwest_locations.py
      - name: Commit refreshed Southwest data
        run: |
          if [[ -n "$(git status --porcelain data/anna-maria-island data/siesta-key data/venice data/sanibel data/fort-myers-beach data/naples data/marco-island)" ]]; then
            git config user.name "knowthegulf-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/anna-maria-island data/siesta-key data/venice data/sanibel data/fort-myers-beach data/naples data/marco-island
            git commit -m "data: refresh Southwest Florida beaches"
            git pull --rebase
            git push
          else
            echo "No Southwest data changes to commit."
          fi

      # Pages deployment is intentionally centralized in deploy-pages.yml.
      # Any successful push to main is followed by the sole site deployment workflow.
