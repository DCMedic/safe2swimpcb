name: Update Southwest Florida locations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-southwest-locations.yml'
      - '.github/recovery/southwest.trigger'
      - 'scripts/update_southwest_locations.py'
      - 'scripts/update_southwest_location.py'
      - 'scripts/collector_resilience.py'
      - 'scripts/protect_current_flag.py'
      - 'scripts/florida_flag_terms.py'
      - 'scripts/apply_florida_flag_terms.py'
      - 'tests/test_collector_resilience.py'
      - 'tests/test_southwest_sources.py'
  schedule:
    - cron: '22 * * * *'

permissions:
  contents: write

concurrency:
  group: knowthegulf-southwest-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate Southwest adapter entry points
        run: python -m py_compile scripts/update_southwest_locations.py scripts/update_southwest_location.py scripts/collector_resilience.py scripts/protect_current_flag.py scripts/florida_flag_terms.py scripts/apply_florida_flag_terms.py
      - name: Run Southwest collector regression tests
        run: pytest -q tests/test_collector_resilience.py tests/test_southwest_sources.py
      - name: Snapshot last-known Southwest status
        shell: bash
        run: |
          mkdir -p tmp/southwest-before
          slugs=(anna-maria-island siesta-key venice sanibel fort-myers-beach naples marco-island)
          for slug in "${slugs[@]}"; do
            for name in current_flag current_status; do
              source="data/${slug}/${name}.json"
              if [[ -f "$source" ]]; then
                cp "$source" "tmp/southwest-before/${slug}-${name}.json"
              fi
            done
          done
      - name: Refresh Southwest sources in parallel with bounded runtime
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p tmp/southwest
          slugs=(anna-maria-island siesta-key venice sanibel fort-myers-beach naples marco-island)
          pids=()
          for slug in "${slugs[@]}"; do
            (
              timeout 12m python scripts/update_southwest_location.py "$slug"
            ) >"tmp/southwest/${slug}.log" 2>&1 &
            pids+=("$!")
          done

          failed=0
          for i in "${!slugs[@]}"; do
            slug="${slugs[$i]}"
            if ! wait "${pids[$i]}"; then
              echo "Southwest collector failed or timed out for ${slug}." >&2
              failed=1
            fi
            cat "tmp/southwest/${slug}.log"
          done
          exit "$failed"
      - name: Prevent transient Southwest flag regressions
        shell: bash
        run: |
          expected_flag_slugs=(anna-maria-island siesta-key venice)
          optional_flag_slugs=(sanibel fort-myers-beach naples marco-island)

          for slug in "${expected_flag_slugs[@]}"; do
            for name in current_flag current_status; do
              previous="tmp/southwest-before/${slug}-${name}.json"
              current="data/${slug}/${name}.json"
              if [[ -f "$previous" && -f "$current" ]]; then
                python scripts/protect_current_flag.py --previous "$previous" --current "$current" --max-age-hours 18 --mode missing-flag
              fi
            done
          done

          for slug in "${optional_flag_slugs[@]}"; do
            for name in current_flag current_status; do
              previous="tmp/southwest-before/${slug}-${name}.json"
              current="data/${slug}/${name}.json"
              if [[ -f "$previous" && -f "$current" ]]; then
                python scripts/protect_current_flag.py --previous "$previous" --current "$current" --max-age-hours 18 --mode unavailable
              fi
            done
          done
      - name: Apply canonical Florida warning-flag terminology
        run: python scripts/apply_florida_flag_terms.py anna-maria-island siesta-key venice sanibel fort-myers-beach naples marco-island
      - name: Commit refreshed Southwest data
        run: |
          if [[ -z "$(git status --porcelain data/anna-maria-island data/siesta-key data/venice data/sanibel data/fort-myers-beach data/naples data/marco-island)" ]]; then
            echo "No Southwest data changes to commit."; exit 0
          fi
          git config user.name "knowthegulf-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/anna-maria-island data/siesta-key data/venice data/sanibel data/fort-myers-beach data/naples data/marco-island
          git commit -m "data: refresh Southwest Florida beaches"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            if [[ "$attempt" -eq 3 ]]; then echo "Failed to persist Southwest data after 3 attempts." >&2; exit 1; fi
            sleep $((attempt * 5))
          done

      # Full unit tests also run centrally in site-health.yml.
      # Pages deployment is intentionally centralized in deploy-pages.yml.
